<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">
<title>품목 수정</title>
</head>
<body>

<h2>품목 수정</h2>

<form action="/update_item" method="post">

<input
type="hidden"
name="item_id"
value="{{ item[0] }}"
>

품목명

<input
type="text"
name="item_name"
value="{{ item[1] }}"
>

<br><br>

분류

<select name="category">

<option value="장비" {% if item[2]=='장비' %}selected{% endif %}>장비</option>

<option value="악세사리" {% if item[2]=='악세사리' %}selected{% endif %}>악세사리</option>

<option value="엠블럼" {% if item[2]=='엠블럼' %}selected{% endif %}>엠블럼</option>

<option value="기타" {% if item[2]=='기타' %}selected{% endif %}>기타</option>

</select>

<br><br>

아이템 수량

<input
type="number"
name="item_quantity"
value="{{ item[3] }}"
>

<br><br>

<button type="submit">
저장
</button>

</form>

</body>
</html>
