<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">
<title>품목 수정</title>
</head>
<body>

<h2>품목 수정</h2>

<form action="/update_item" method="post">

<input
type="hidden"
name="item_id"
value="{{ item[0] }}"
>

품목명

<input
type="text"
name="item_name"
value="{{ item[1] }}"
>

<br><br>

분류

<select name="category">

<option value="장비">장비</option>
<option value="악세사리">악세사리</option>
<option value="엠블럼">엠블럼</option>

</select>

<br><br>

당첨수

<input
type="number"
name="winner_count"
value="{{ item[3] }}"
>

<br><br>

<button type="submit">
저장
</button>

</form>

</body>
</html>
