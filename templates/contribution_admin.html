<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>⭐ 기여도 관리</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>⭐ 기여도 관리</h2>

        <a
            href="/admin"
            class="btn btn-secondary">
            ← 관리자 페이지
        </a>

    </div>

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h4 class="mb-0">
                회원 기여도 관리
            </h4>

        </div>

        <div class="card-body">

            <table class="table table-striped table-hover align-middle">

                <thead>

                    <tr>

                        <th>닉네임</th>

                        <th width="150">
                            현재 기여도
                        </th>

                        <th width="500">
                            빠른 지급
                        </th>

                    </tr>

                </thead>

                <tbody>

                {% for user in users %}

                    <tr>

                        <td>

                            <strong>
                                {{ user[1] }}
                            </strong>

                        </td>

                        <td>

                            <span
                                class="badge bg-warning text-dark fs-6">

                                ⭐ {{ user[2] }}점

                            </span>

                        </td>

                        <td>

                            <div class="d-flex flex-wrap gap-2">

                                <!-- 마물운전 -->

                                <form
                                    action="/give_contribution"
                                    method="post">

                                    <input
                                        type="hidden"
                                        name="user_id"
                                        value="{{ user[0] }}">

                                    <input
                                        type="hidden"
                                        name="points"
                                        value="1">

                                    <button
                                        class="btn btn-success btn-sm"
                                        type="submit">

                                        🚛 마물 +1

                                    </button>

                                </form>

                                <!-- 연맹시련 1등 -->

                                <form
                                    action="/give_contribution"
                                    method="post">

                                    <input
                                        type="hidden"
                                        name="user_id"
                                        value="{{ user[0] }}">

                                    <input
                                        type="hidden"
                                        name="points"
                                        value="3">

                                    <button
                                        class="btn btn-warning btn-sm"
                                        type="submit">

                                        🥇 1등 +3

                                    </button>

                                </form>

                                <!-- 연맹시련 2등 -->

                                <form
                                    action="/give_contribution"
                                    method="post">

                                    <input
                                        type="hidden"
                                        name="user_id"
                                        value="{{ user[0] }}">

                                    <input
                                        type="hidden"
                                        name="points"
                                        value="2">

                                    <button
                                        class="btn btn-info btn-sm"
                                        type="submit">

                                        🥈 2등 +2

                                    </button>

                                </form>

                                <!-- 연맹시련 3등 -->

                                <form
                                    action="/give_contribution"
                                    method="post">

                                    <input
                                        type="hidden"
                                        name="user_id"
                                        value="{{ user[0] }}">

                                    <input
                                        type="hidden"
                                        name="points"
                                        value="1">

                                    <button
                                        class="btn btn-secondary btn-sm"
                                        type="submit">

                                        🥉 3등 +1

                                    </button>

                                </form>

                                <!-- 차감 -1 -->
                                <form action="/give_contribution" method="post">
                                    <input type="hidden" name="user_id" value="{{ user[0] }}">
                                    <input type="hidden" name="points" value="-1">
                                    <button class="btn btn-outline-danger btn-sm" type="submit">
                                        ➖ -1
                                    </button>
                                </form>

                                <!-- 차감 -2 -->
                                <form action="/give_contribution" method="post">
                                    <input type="hidden" name="user_id" value="{{ user[0] }}">
                                    <input type="hidden" name="points" value="-2">
                                    <button class="btn btn-outline-danger btn-sm" type="submit">
                                        ➖ -2
                                    </button>
                                </form>

                                <!-- 차감 -3 -->
                                <form action="/give_contribution" method="post">
                                    <input type="hidden" name="user_id" value="{{ user[0] }}">
                                    <input type="hidden" name="points" value="-3">
                                    <button class="btn btn-outline-danger btn-sm" type="submit">
                                        ➖ -3
                                    </button>
                                </form>
                                <form
                                    action="/reset_contribution"
                                    method="post"
                                    onsubmit="return confirm('모든 회원의 기여도를 0으로 초기화하시겠습니까?');"
                                    class="mb-3">

                                    <button
                                        type="submit"
                                        class="btn btn-danger">
                                        🔄 전체 기여도 초기화
                                    </button>

                                </form>
                            </div>

                        </td>

                    </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>
