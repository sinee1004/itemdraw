<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 관리</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">
        <h2>👥 회원 관리</h2>

        <a href="/admin" class="btn btn-secondary">
            ← 관리자 페이지
        </a>
    </div>

    <table class="table table-bordered table-hover align-middle">

        <thead class="table-dark">
            <tr>
                <th>닉네임</th>
                <th>기여도</th>
                <th>가입일</th>
                <th>관리</th>
            </tr>
        </thead>

        <tbody>

        {% for user in users %}

            <tr>

                <td>{{ user[1] }}</td>

                <td>⭐ {{ user[2] }}</td>

                <td>{{ user[3] }}</td>

                <td>

                    <form
                        action="/delete_user"
                        method="post"
                        onsubmit="return confirm('정말 이 회원을 삭제하시겠습니까?\\n신청 내역과 당첨 내역도 함께 삭제됩니다.');">

                        <input
                            type="hidden"
                            name="user_id"
                            value="{{ user[0] }}">

                        <button
                            class="btn btn-danger btn-sm"
                            type="submit">

                            🗑️ 회원 삭제

                        </button>

                    </form>

                </td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
