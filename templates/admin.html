<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>관리자 페이지</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-4">

<h1>⚙ 관리자 페이지</h1>

<div>

<a href="/draw">
<button class="btn btn-primary">
추첨 실행
</button>
</a>

<a href="/results">
<button class="btn btn-success">
결과 보기
</button>
</a>

<a href="/logout">
<button class="btn btn-secondary">
로그아웃
</button>
</a>

</div>

</div>

<div class="card shadow mb-4">

<div class="card-header bg-primary text-white">

품목 추가

</div>

<div class="card-body">

<form action="/add_item" method="post">

<div class="row">

<div class="col-md-4">

<label class="form-label">
품목명
</label>

<input
class="form-control"
type="text"
name="item_name"
required>

</div>

<div class="col-md-4">

<label class="form-label">
분류
</label>

<select
class="form-select"
name="category">

<option value="장비">장비</option>
<option value="악세사리">악세사리</option>
<option value="엠블럼">엠블럼</option>

</select>

</div>

<div class="col-md-2">

<label class="form-label">
당첨 인원
</label>

<input
class="form-control"
type="number"
name="winner_count"
value="1"
min="1"
required>

</div>

<div class="col-md-2 d-flex align-items-end">

<button
class="btn btn-primary w-100"
type="submit">

추가

</button>

</div>

</div>

</form>

</div>

</div>

<div class="card shadow mb-4">

<div class="card-header bg-success text-white">

신청자 목록

</div>

<div class="card-body">

<table class="table table-striped table-hover">

<thead>

<tr>
<th>닉네임</th>
<th>품목</th>
<th>접수번호</th>
</tr>

</thead>

<tbody>

{% for row in entries %}

<tr>

<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

<div class="card shadow">

<div class="card-header bg-dark text-white">

등록 품목

</div>

<div class="card-body">

<table class="table table-striped table-hover">

<thead>

<tr>

<th>ID</th>
<th>품목명</th>
<th>분류</th>
<th>당첨 수</th>
<th>관리</th>

</tr>

</thead>

<tbody>

{% for item in items %}

<tr>

<td>{{ item[0] }}</td>
<td>{{ item[1] }}</td>
<td>{{ item[2] }}</td>
<td>{{ item[3] }}</td>

<td>

<a href="/edit_item/{{ item[0] }}">

<button
class="btn btn-warning btn-sm">

수정

</button>

</a>

<a
href="/delete_item/{{ item[0] }}"
onclick="return confirm('삭제하시겠습니까?')">

<button
class="btn btn-danger btn-sm">

삭제

</button>

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</body>

</html>
