<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>아이템 추첨 신청</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg">

<div class="card-header bg-success text-white text-center">

<h3 class="mb-0">
🎁 아이템 추첨 신청
</h3>

</div>

<div class="card-body">
<div id="timer" class="alert alert-info text-center">
추첨 대기중
</div>
<form id="applyForm">

<div class="mb-3">

<label class="form-label fw-bold">
닉네임
</label>

<input
class="form-control"
type="text"
name="nickname"
placeholder="닉네임 입력"
required>

</div>

<div class="mb-4">

<label class="form-label fw-bold">
신청 품목
</label>

<select
class="form-select"
name="item_name">

{% for item in items %}

<option value="{{ item[0] }}">
{{ item[1] }} - {{ item[0] }}
</option>

{% endfor %}

</select>

</div>

<div class="d-grid">

<button
class="btn btn-success btn-lg"
type="submit">

신청하기

</button>

</div>

</form>

<div id="result" class="mt-4"></div>

</div>

</div>

<div class="text-center mt-3 text-muted">

<small>
장비 1개 / 악세사리 1개 / 엠블럼 2개 신청 가능
</small>

</div>

<div class="card shadow-lg mt-5">

<div class="card-header bg-warning text-dark text-center">

<h3 class="mb-0">
🏆 당첨 결과
</h3>

</div>

<div class="card-body">

{% if winners %}

<table class="table table-striped table-hover">

<thead>

<tr>

<th>닉네임</th>
<th>당첨 품목</th>

</tr>

</thead>

<tbody>

{% for row in winners %}

<tr>

<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>

</tr>

{% endfor %}

</tbody>

</table>

{% else %}

<div class="alert alert-warning text-center">

아직 추첨 결과가 없습니다.

</div>

{% endif %}

</div>

</div>

</div>

</div>

</div>

<script>

document
.getElementById("applyForm")
.addEventListener("submit", async function(e){

e.preventDefault();

const formData = new FormData(this);

const response = await fetch("/apply",{
method:"POST",
body:formData
});

const data = await response.json();

if(data.success){

document.getElementById("result").innerHTML =

`
<div class="alert alert-success text-center">

<h5>
신청 완료
</h5>

<hr>

접수번호

<h3 class="text-success">
${data.entry_number}
</h3>

</div>
`;

}else{

document.getElementById("result").innerHTML =

`
<div class="alert alert-danger text-center">

${data.message}

</div>
`;

}

});

</script>
<script>

let drawFinished = false;

async function updateTimer(){

    try{

        const res = await fetch('/countdown');
        const data = await res.json();

        let sec = data.remaining;

        if(sec <= 0){

            document.getElementById("timer").innerHTML =
            "🏆 추첨 완료";

            if(!drawFinished){

                drawFinished = true;

                setTimeout(()=>{
                    location.reload();
                },2000);

            }

            return;
        }

        let min = Math.floor(sec / 60);
        let remain = sec % 60;

        document.getElementById("timer").innerHTML =
        `⏰ 추첨까지 ${min}분 ${remain}초`;

    }
    catch(err){

        document.getElementById("timer").innerHTML =
        "신청 가능";

    }

}

setInterval(updateTimer,1000);

updateTimer();

</script>
</body>

</html>
